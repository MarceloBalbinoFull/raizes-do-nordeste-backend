spring.application.name=raizes-do-nordeste-backend

# Configuracao do MySQL via variaveis de ambiente
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/raizes_do_nordeste}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Mantem o comportamento local ja adotado pelo projeto
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Evita logs excessivamente detalhados em operacao normal
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# Sem valor padrao para impedir subida com chave conhecida
app.jwt.secret=${APP_JWT_SECRET}

# Bootstrap admin opcional: nao preencher se ja existir administrador
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
